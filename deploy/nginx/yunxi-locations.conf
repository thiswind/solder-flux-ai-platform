# 云锡助焊剂AI平台 — nginx 子路径 location 片段（include 进 80 端口 default server）
# 部署位：/etc/nginx/snippets/yunxi-locations.conf（勿放 conf.d/——会被 http 块自动 include 报错）
# 挂载：homework-collector-preview.conf 的 server 块内、`location /` 之前一行：
#   include /etc/nginx/snippets/yunxi-locations.conf;
# 原理：proxy_pass 尾斜杠剥掉 /yunxi/... 前缀 → 各后端原生根路径部署
# 回滚：删 include 行 + 本文件，nginx -s reload

location = /yunxi { return 301 /yunxi/; }

location ^~ /yunxi/compute/ {
    proxy_pass http://127.0.0.1:18001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;
}

location ^~ /yunxi/data/ {
    proxy_pass http://127.0.0.1:18000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;
}

# 门户最后（前缀最短）；hash 路由 + 相对资源引用，剥前缀直达
location ^~ /yunxi/ {
    proxy_pass http://127.0.0.1:18003/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
}
